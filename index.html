<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Portal Box - Live Web Edition</title>
    <style>
        body {
            background: linear-gradient(135deg, #1e3c72, #2a5298);
            margin: 0;
            padding: 20px 10px;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            font-family: Arial, sans-serif;
        }
        .portal-box {
            width: 100%;
            max-width: 380px;
            background: #ffffff;
            padding: 25px;
            border-radius: 15px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.3);
            box-sizing: border-box;
        }
        h2 {
            margin-top: 0;
            color: #1e3c72;
            text-align: center;
            font-size: 20px;
            border-bottom: 2px solid #1e3c72;
            padding-bottom: 6px;
            margin-bottom: 15px;
        }
        h3 { color: #2a5298; font-size: 14px; margin-top: 15px; margin-bottom: 8px; }
        .form-group { margin-bottom: 12px; }
        label { display: block; font-weight: bold; margin-bottom: 4px; color: #333; font-size: 13px; }
        input, select { width: 100%; padding: 10px; border: 1px solid #ccc; border-radius: 6px; font-size: 14px; box-sizing: border-box; outline: none; }
        button { width: 100%; padding: 12px; background: #1e3c72; color: white; border: none; border-radius: 6px; font-size: 15px; font-weight: bold; cursor: pointer; }
        .info-panel { background: #f1f5f9; padding: 10px; border-radius: 6px; font-size: 13px; margin-bottom: 10px; border: 1px solid #cbd5e1; }
        .info-panel div { padding: 4px 0; border-bottom: 1px dashed #cbd5e1; }
        .info-panel div:last-child { border-bottom: none; }
    </style>
</head>
<body>

    <div class="portal-box">
        <h2>1. Student Login</h2>
        <div class="form-group">
            <label>Student ID</label>
            <input type="text" id="loginId" placeholder="student123">
        </div>
        <div class="form-group">
            <label>Password</label>
            <input type="text" id="loginPass" placeholder="123456">
        </div>
        <button onclick="checkLogin()">Sign In</button>

        <div style="margin: 20px 0; border-top: 2px dashed #ccc;"></div>

        <h2>2. Student Registration</h2>
        <div class="form-group">
            <label>Full Name</label>
            <input type="text" id="regName" placeholder="Your Name">
        </div>
        <div class="form-group">
            <label>Department</label>
            <select id="regDept">
                <option value="CSE">Computer Science (CSE)</option>
                <option value="EEE">Electrical Engineering (EEE)</option>
                <option value="BBA">Business Administration (BBA)</option>
            </select>
        </div>
        <div class="form-group">
            <label>Password</label>
            <input type="text" id="regPass" placeholder="Create Password">
        </div>
        <button onclick="registerAccount()">Create Account</button>

        <div style="margin: 20px 0; border-top: 2px dashed #ccc;"></div>

        <h2>3. Live Dashboard</h2>
        <div class="info-panel">
            <div><b>Name:</b> <span id="dashName">Demo Student</span></div>
            <div><b>Dept:</b> <span id="dashDept">CSE</span></div>
            <div><b>CGPA:</b> 3.85 (Active)</div>
        </div>

        <h3>📢 Notices</h3>
        <div class="info-panel" style="font-size: 12px; background: #fffdf5;">
            • Mid-Term routine is published.<br>
            • Registration deadline extended.
        </div>

        <h3>📅 Class Routine</h3>
        <div class="info-panel" style="font-size: 12px; background: #f0fdf4;" id="routineBox">
            Sun: Programming (9 AM)<br>Mon: Discrete Math (11 AM)
        </div>
    </div>

    <script>
        var activeUser = { id: "student123", name: "John Doe", dept: "CSE", pass: "123456" };
        function checkLogin() {
            var inputId = document.getElementById('loginId').value.trim();
            var inputPass = document.getElementById('loginPass').value.trim();
            if (inputId === activeUser.id && inputPass === activeUser.pass) {
                document.getElementById('dashName').innerText = activeUser.name;
                document.getElementById('dashDept').innerText = activeUser.dept;
                alert("Login Successful!");
            } else {
                alert("Wrong ID or Password!");
            }
        }
        function registerAccount() {
            var name = document.getElementById('regName').value.trim();
            var dept = document.getElementById('regDept').value;
            var pass = document.getElementById('regPass').value.trim();
            if (name === '' || pass === '') { alert("Please fill fields!"); return; }
            activeUser.id = "newuser"; activeUser.name = name; activeUser.dept = dept; activeUser.pass = pass;
            document.getElementById('dashName').innerText = name;
            document.getElementById('dashDept').innerText = dept;
            alert("Registration Done!");
        }
    </script>
</body>
</html>
